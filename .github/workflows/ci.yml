name: CI

on:
  push:
    branches: [main]
    paths-ignore: ['**.md', '.claude/**', 'LICENSE', 'windows/**', 'global.json', '.github/workflows/windows.yml']
  pull_request:
    paths-ignore: ['**.md', '.claude/**', 'LICENSE', 'windows/**', 'global.json', '.github/workflows/windows.yml']

permissions:
  contents: read

jobs:
  test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - run: make test
